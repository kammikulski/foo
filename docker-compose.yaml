services:
  replica1:
    build: ./node/
    environment: 
      - replication=Replica1
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - backend

  replica2:
    build: ./node/
    environment:
      - replication=Replica2
    ports:
      - "127.0.0.1:3002:3000"
    networks:
      - backend

  replica3:
    build: ./node/
    environment:
      - replication=Replica3
    ports:
      - "127.0.0.1:3003:3000"
    networks:
      - backend

  nginx:
    build: ./nginx/
    container_name: nginx
    volumes:
      - nginx-logs:/var/log/nginx
    ports:
      - "8080:80"
      - "443:443" 
    depends_on:
      - replica1
      - replica2
      - replica3
    networks:
      - backend

  fail2ban:
    build: ./fail2ban
    container_name: fail2ban
    volumes:
      - nginx-logs:/remotelogs/nginx/
      - ./fail2ban/jail.local:/etc/fail2ban/jail.local
      - ./fail2ban/filter.d/nginx-abuse.conf:/etc/fail2ban/filter.d/nginx-abuse.conf
      - ./fail2ban/action.d/send-ban-action.conf:/etc/fail2ban/action.d/send-ban-action.conf
      - ./fail2ban/send-action.py:/opt/scripts/send-action.py
    depends_on:
      - nginx
      - firewall
    restart: always
  
  firewall: 
    build: ./firewall/
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host
    depends_on:
      - rabbit

  rabbit:
    image: rabbitmq:4.2.3
    ports:
      - "127.0.0.1:5672:5672"

networks:
 backend:
   driver: bridge
   name: backend

volumes:
  nginx-logs:
    driver: local
